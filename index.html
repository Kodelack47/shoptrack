<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ShopTrack - Product Listings</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1>ShopTrack</h1>
      <p class="subtitle">Product Listings (FR1 prototype)</p>
    </header>

    <section class="card">
      <h2 id="formTitle">Add a Product</h2>
      <form id="productForm" novalidate>
        <input type="hidden" id="productId" />

        <div class="field">
          <label for="sku">SKU</label>
          <input type="text" id="sku" placeholder="e.g. TKS-001" />
          <span class="error" id="skuError"></span>
        </div>

        <div class="field">
          <label for="name">Product name</label>
          <input type="text" id="name" placeholder="e.g. Handwoven Basket" />
          <span class="error" id="nameError"></span>
        </div>

        <div class="field">
          <label for="price">Price (USD)</label>
          <input type="number" id="price" step="0.01" min="0" placeholder="0.00" />
          <span class="error" id="priceError"></span>
        </div>

        <div class="field">
          <label for="quantity">Quantity on hand</label>
          <input type="number" id="quantity" step="1" min="0" placeholder="0" />
          <span class="error" id="quantityError"></span>
        </div>

        <div class="formActions">
          <button type="submit" id="submitBtn">Add Product</button>
          <button type="button" id="cancelBtn" class="secondary" hidden>Cancel</button>
        </div>

        <p class="formMessage" id="formMessage"></p>
      </form>
    </section>

    <section class="card">
      <h2>Current Listings</h2>
      <table id="productTable">
        <thead>
          <tr>
            <th>SKU</th>
            <th>Name</th>
            <th>Price</th>
            <th>Qty</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="productTableBody">
          <!-- rows injected by app.js -->
        </tbody>
      </table>
      <p id="emptyState" class="emptyState">No products yet. Add your first listing above.</p>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
